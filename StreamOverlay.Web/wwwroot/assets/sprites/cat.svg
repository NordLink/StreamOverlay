<svg id="Cat" class="svg-char" width="200" hight="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Тело -->
  <ellipse cx="100" cy="140" rx="50" ry="40" fill="#FFA07A" />
  
  <!-- Голова -->
  <circle cx="100" cy="90" r="45" fill="#FFA07A" />
  
  <!-- Левое ухо -->
  <polygon points="65,60 75,25 95,55" fill="#FFA07A" />
  <polygon points="70,55 77,32 90,52" fill="#FFB6C1" />
  
  <!-- Правое ухо -->
  <polygon points="135,60 125,25 105,55" fill="#FFA07A" />
  <polygon points="130,55 123,32 110,52" fill="#FFB6C1" />
  
  <!-- Левый глаз -->
  <ellipse cx="85" cy="85" rx="8" ry="10" fill="white" />
  <ellipse cx="87" cy="85" rx="4" ry="7" fill="#2F4F4F" />
  <circle cx="88" cy="82" r="2" fill="white" />
  
  <!-- Правый глаз -->
  <ellipse cx="115" cy="85" rx="8" ry="10" fill="white" />
  <ellipse cx="117" cy="85" rx="4" ry="7" fill="#2F4F4F" />
  <circle cx="118" cy="82" r="2" fill="white" />
  
  <!-- Нос -->
  <polygon points="100,95 97,102 103,102" fill="#FF69B4" />
  
  <!-- Рот -->
  <path d="M 97,102 Q 100,108 100,102" stroke="#333" stroke-width="1.5" fill="none" />
  <path d="M 103,102 Q 100,108 100,102" stroke="#333" stroke-width="1.5" fill="none" />
  
  <!-- Усы (левые) -->
  <line x1="70" y1="97" x2="50" y2="93" stroke="#333" stroke-width="1.2" />
  <line x1="70" y1="102" x2="48" y2="102" stroke="#333" stroke-width="1.2" />
  <line x1="70" y1="107" x2="50" y2="111" stroke="#333" stroke-width="1.2" />
  
  <!-- Усы (правые) -->
  <line x1="130" y1="97" x2="150" y2="93" stroke="#333" stroke-width="1.2" />
  <line x1="130" y1="102" x2="152" y2="102" stroke="#333" stroke-width="1.2" />
  <line x1="130" y1="107" x2="150" y2="111" stroke="#333" stroke-width="1.2" />
  
  <!-- Лапки -->
  <ellipse cx="80" cy="170" rx="15" ry="10" fill="#FFA07A" />
  <ellipse cx="120" cy="170" rx="15" ry="10" fill="#FFA07A" />
  
  <!-- Хвост -->
  <path d="M 62,145 Q 40,120 45,100 Q 48,90 55,95" stroke="#FFA07A" stroke-width="8" fill="none" stroke-linecap="round" />
</svg>