<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Demo Scene</title>
    <link rel="stylesheet" href="/css/overlay.css" />
    <link rel="stylesheet" href="/css/gameWorld.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script type="module" src="/js/orchestrates/demoPage.js"></script>
   
</head>
<body>
    <div id="container">

        <div id="masked-bg">
            <div id="sky">
                <div class="moon"></div>
                <div class="moon-glow"></div>
            </div>
        </div>

        <div class="wrapper">
            <div class="channel-name-wrapper">
                <div id="channel-name"></div>
            </div>

            <div class="chat-wrapper">
                <div id="chat"></div>
            </div>

            <div class="viewers-info-wrapper">
                <div id="viewers-info"></div>
            </div>

            <div id="world"></div>
        </div>

    </div>

</body>
<svg width="0" height="0">
    <defs>
        <mask id="video-mask" maskContentUnits="objectBoundingBox">
            <rect width="1" height="1" fill="white" />
            <rect x="0.03906" y="0.13333" width="0.54687" height="0.55555" fill="black" />
        </mask>
    </defs>
</svg>
</html>
