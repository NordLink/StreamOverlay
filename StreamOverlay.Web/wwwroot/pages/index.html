<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stream Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0A141E, #0B1A2E);
            font-family: 'Motiva Sans', 'Segoe UI', 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #E5E7EB;
            line-height: 1.5;
            padding: 2rem;
        }

        /* Контейнер карточки в стиле Steam */
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(27, 40, 56, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 2.5rem 2rem 3rem;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(102, 153, 204, 0.2);
            text-align: center;
            transition: box-shadow 0.2s ease;
        }

            .container:hover {
                box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(102, 153, 204, 0.4);
            }

        /* Заголовок */
        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #FFFFFF 0%, #9BB7D4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.5px;
            margin-bottom: 0.75rem;
        }

        .container p {
            font-size: 1.1rem;
            color: #B0C4DE;
            margin-bottom: 2.5rem;
            border-bottom: 1px dashed #2C4056;
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        /* Сетка кнопок / ссылок */
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }

        /* Стиль кнопок как в интерфейсе Steam */
        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(to bottom, #2A3A4F, #1E2A3A);
            padding: 0.9rem 2rem;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            color: #E0EFF9;
            transition: all 0.2s ease-in-out;
            border: 1px solid rgba(102, 153, 204, 0.4);
            box-shadow: 0 6px 0 #0F1A24;
            letter-spacing: 0.3px;
        }

            /* Цвет для второстепеной ссылки (чат) */
            .nav-link.secondary {
                background: linear-gradient(to bottom, #27445e, #1C2F42);
                border-color: rgba(255, 215, 120, 0.3);
            }

            /* Эффекты при наведении */
            .nav-link:hover {
                transform: translateY(-3px);
                background: linear-gradient(to bottom, #3C556E, #263B4F);
                box-shadow: 0 8px 0 #0F1A24;
                border-color: #6A8FB2;
                color: white;
            }

            .nav-link:active {
                transform: translateY(3px);
                box-shadow: 0 2px 0 #0F1A24;
            }

        /* Иконки внутри ссылок (эмодзи заменяем кастомными псевдо, но оставляем текст с эмодзи для простоты) */
        .nav-link {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Адаптивность */
        @media (max-width: 550px) {
            .container {
                padding: 1.8rem 1.5rem 2.5rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .nav-link {
                padding: 0.7rem 1.4rem;
                font-size: 1rem;
                gap: 8px;
            }

            .nav-links {
                gap: 1rem;
            }
        }

        /* Дополнительная игровая текстура — лёгкий градиентный ореол */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 70% 20%, rgba(0, 153, 255, 0.08), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StreamOverlay Panel</h1>
        <p>Выберите нужный раздел:</p>
        <div class="nav-links">
            <a href="/demo" class="nav-link" target="_blank">🖥️ Демо-сцена</a>
            <a href="/overlay" class="nav-link  secondary" target="_blank">🎥 Оверлей</a>
            <a href="/chat" class="nav-link" target="_blank">💬 Чат</a>
            <a href="/viewers" class="nav-link  secondary" target="_blank">👥 Статистика</a>
        </div>
    </div>
</body>
</html>
