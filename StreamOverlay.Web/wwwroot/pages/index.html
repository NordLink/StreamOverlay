<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>StreamOverlay</title>
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/viewers.css">

</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-title">
                    StreamOverlay
                </div>
                <div class="logo-subtitle">
                    Панель управления
                </div>
            </div>
            <nav class="nav">
                <div class="nav-title">
                    Основное
                </div>
                <button class="nav-button active" data-page="home">
                    <span class="nav-icon">🏠</span>
                    <span>Главная</span>
                </button>
                <div class="nav-title">Виджеты</div>
                <button class="nav-button" data-page="chat">
                    <span class="nav-icon">💬</span>
                    <span>Чат</span>
                </button>
                <button class="nav-button" data-page="viewers">
                    <span class="nav-icon">🔢</span>
                    <span>Счётчик зрителей</span>
                </button>
                <button class="nav-button" data-page="gameworld">
                    <span class="nav-icon">🎮</span>
                    <span>Игровой мир</span>
                </button>
                <button class="nav-button" data-page="dueldisplay">
                    <span class="nav-icon">⚔️</span>
                    <span>Дуэль</span>
                </button>
                <div class="nav-title">Док-панели</div>
                <button class="nav-button" data-page="chatters">
                    <span class="nav-icon">👥</span>
                    <span>Чаттерсы</span>
                </button>
                <div class="nav-title">Система</div>
                <button class="nav-button" data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    <span>Настройки</span>
                </button>
            </nav>
        </aside>
        <main class="main">
            <div id="app" class="content"></div>
        </main>
    </div>
    <script type="module" src="/js/orchestrates/homePage.js"></script>
</body>

</html>
