<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stream Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
        }

            .container h1 {
                color: #333;
                margin-bottom: 15px;
                font-size: 2.5em;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .container p {
                color: #666;
                margin-bottom: 50px;
                font-size: 1.1em;
            }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-direction: column;
        }

        .nav-link {
            display: inline-block;
            padding: 18px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            border: none;
        }

            .nav-link:hover {
                transform: translateY(-3px);
                box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
            }

            .nav-link:active {
                transform: translateY(-1px);
            }

            .nav-link.secondary {
                background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
            }

                .nav-link.secondary:hover {
                    box-shadow: 0 15px 35px rgba(245, 87, 108, 0.6);
                }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

                .container h1 {
                    font-size: 2em;
                }

            .nav-link {
                padding: 15px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StreamOverlay Panel</h1>
        <p>Выберите нужный раздел:</p>
        <div class="nav-links">
            <a href="/overlay" class="nav-link" target="_blank">🎥 Оверлей</a>
            <a href="/chat" class="nav-link secondary" target="_blank">💬 Чат</a>
            <a href="/viewers" class="nav-link" target="_blank">👥 Статистика</a>
        </div>
    </div>
</body>
</html>
