<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stream Overlay</title>
    <link rel="stylesheet" href="/css/overlay.css" />
    <link rel="stylesheet" href="/css/characters.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script type="module" src="/js/OverlayPage.js"></script>
</head>
<body>

    <div id="sky">
        <div class="moon"></div>
        <div class="moon-glow"></div>
    </div>

    <div id="container">        
            <div class="channel-name-wrapper">
                <div id="channel-name"></div>
            </div>

            <div class="chat-wrapper">
                <div id="chat"></div>
            </div>

            <div class="viewers-info-wrapper">
                <div id="viewers-info"></div>
            </div>      
        <div id="world"></div>
    </div>
</body>
<svg width="0" height="0">
    <defs>
        <mask id="video-mask">
            <rect width="2560" height="1440" fill="white" />
            <rect x="100" y="192" width="1400" height="800" rx="0" fill="black" />
        </mask>
    </defs>
</svg>
</html>
