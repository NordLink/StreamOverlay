<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stream Overlay</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/characters.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script type="module" src="/js/app.js"></script>
</head>
<body>

    <div id="sky">
        <div class="moon"></div>
        <div class="moon-glow"></div>
    </div>

    <div id="container">
        <div class="chat-wrapper">
            <div class="chat-header">
                <div id="channelName" class="value">—</div>
            </div>

            <div class="scene">
                <section class="screen-section">
                    <div class="screen-frame">
                        <div class="screen-inner">
                            <div id="chat" class="chat-list"></div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="viewers-info">
                <div class="info-block">
                    <div class="label">Twitch</div>
                    <div id="twitchViewers" class="value">0</div>
                </div>

                <div class="info-block">
                    <div class="label">VK</div>
                    <div id="vkViewers" class="value">0</div>
                </div>

                <div class="info-block">
                    <div class="label">Всего</div>
                    <div id="viewerCount" class="value">0</div>
                </div>
            </div>

        </div>

        <div id="world"></div>
    </div>
</body>
<svg width="0" height="0">
    <defs>
        <mask id="video-mask">
            <rect width="2560" height="1440" fill="white" />
            <rect x="100" y="192" width="1400" height="800" rx="0" fill="black" />
        </mask>
    </defs>
</svg>
</html>
