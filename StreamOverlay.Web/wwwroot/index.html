<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stream Overlay</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/characters.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script type="module" src="/js/app.js"></script>
</head>
<body>
    <div class="sky">
        <div class="stars stars-back"></div>
        <div class="stars stars-mid"></div>
        <div class="stars stars-front"></div>
        <div class="moon"></div>
        <div class="moon-glow"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="cloud cloud-4"></div>
    </div>
    <div class="overlay">
        <header class="topbar">
            <div class="info-block">
                <div class="label">Канал</div>
                <div id="channelName" class="value">—</div>
            </div>
            <div class="viewers-grid">
                <div class="info-block">
                    <div class="label">Twitch</div>
                    <div id="twitchViewers" class="value">0</div>
                </div>
                <div class="info-block">
                    <div class="label">VK</div>
                    <div id="vkViewers" class="value">0</div>
                </div>
                <div class="info-block">
                    <div class="label">Всего</div>
                    <div id="viewerCount" class="value">0</div>
                </div>
            </div>
            <div class="info-block info-block-right">
                <div class="label">Статус</div>
                <div id="liveStatus" class="value status-badge">CONNECTING</div>
            </div>
        </header>
        <main class="scene">
            <section class="screen-section">
                <div class="screen-frame">
                    <div class="screen-inner">
                        <div class="chat-header">
                            <div class="chat-title">LIVE CHAT</div>
                            <div class="chat-subtitle">Twitch + VK</div>
                        </div>
                        <div id="chat" class="chat-list"></div>
                    </div>
                </div>
            </section>

            <div id="world"></div>
        </main>
    </div>
</body>
</html>
